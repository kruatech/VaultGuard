name: Bug report
description: Report a problem with VaultGuard
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please do **not** include passwords, vault contents, tokens, or server URLs you consider sensitive.
        For security vulnerabilities, do not use this form — see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "e.g. 14.5"
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: VaultGuard version
      placeholder: "e.g. 1.0.0 (1)"
    validations:
      required: true
  - type: dropdown
    id: server
    attributes:
      label: Vault type
      description: Local KeePass file, or which server the account is connected to.
      options:
        - Local KeePass file (.kdbx) — no server
        - Self-hosted Vaultwarden
        - Bitwarden cloud (.com)
        - Bitwarden EU (.eu)
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Console output or screenshots, with any sensitive data redacted.
    validations:
      required: false
