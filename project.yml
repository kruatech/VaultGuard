name: VaultGuard
options:
  bundleIdPrefix: com.kruatech
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  defaultConfig: Release
  groupSortPosition: top

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

packages:
  # The Argon2 reference implementation, vendored. It replaced the Argon2Swift package, which
  # pulled this library in twice — a SwiftPM dependency on a floating branch and a git submodule
  # that broke fresh checkouts. No network is involved in building the KDF any more. See
  # Packages/Argon2/PROVENANCE.md for the pinned upstream commit and file hashes.
  Argon2:
    path: Packages/Argon2

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    PRODUCT_NAME: VaultGuard
    MARKETING_VERSION: "2.1.0"
    CURRENT_PROJECT_VERSION: "11"
    INFOPLIST_FILE: VaultGuard/Resources/Info.plist
    CODE_SIGN_ENTITLEMENTS: VaultGuard/Resources/VaultGuard.entitlements
    ENABLE_HARDENED_RUNTIME: YES
    # DEVELOPMENT_TEAM defaults to blank in Config/Signing.xcconfig.
    # For local signed builds, copy Config/Signing.example.xcconfig to
    # Config/Signing.local.xcconfig and set your Apple Team ID.

targets:
  VaultGuard:
    type: application
    platform: macOS
    sources:
      - path: VaultGuard
        excludes:
          - "AutoFillProvider/**"
    settings:
      base:
        INFOPLIST_FILE: VaultGuard/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: VaultGuard/Resources/VaultGuard.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.kruatech.vaultguard
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    dependencies:
      - package: Argon2
        product: CArgon2
      - target: AutoFillProvider
    entitlements:
      path: VaultGuard/Resources/VaultGuard.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.developer.authentication-services.autofill-credential-provider: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.application-groups:
          - group.com.kruatech.vaultguard
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.kruatech.vaultguard.private
          - $(AppIdentifierPrefix)com.kruatech.vaultguard
    scheme:
      testTargets:
        - VaultGuardTests

  AutoFillProvider:
    type: app-extension
    platform: macOS
    sources:
      - path: VaultGuard/AutoFillProvider/PrivacyInfo.xcprivacy
      - path: VaultGuard/AutoFillProvider/CredentialProviderViewController.swift
      - path: VaultGuard/AutoFillProvider/AutoFillVault.swift
      - path: VaultGuard/AutoFillProvider/CredentialProviderViewController+Passkey.swift
      - path: VaultGuard/Services/CryptoService.swift
      - path: VaultGuard/Services/Argon2KDF.swift
      - path: VaultGuard/Services/KeychainService.swift
      - path: VaultGuard/Services/VaultCache.swift
      - path: VaultGuard/Services/AutoFillCache.swift
      - path: VaultGuard/Services/Fido2.swift
      - path: VaultGuard/Services/PasskeyStore.swift
      - path: VaultGuard/Services/SecureData.swift
      - path: VaultGuard/Services/Logger.swift
      - path: VaultGuard/Services/LocalizationManager.swift
      - path: VaultGuard/Shared/SharedConfig.swift
      - path: VaultGuard/Shared/AutoFillHostMatcher.swift
      - path: VaultGuard/Models/Models.swift
      # Локализация расширения: XcodeGen создаёт variant group только когда в
      # источниках указан каталог, СОДЕРЖАЩИЙ .lproj, а не сами .lproj. При
      # прямом указании en.lproj/ru.lproj строки не попадали в .appex, и в UI
      # автозаполнения показывались сырые ключи вида autofill.errLocked.
      - path: VaultGuard/Resources
        includes:
          - "en.lproj/Localizable.strings"
          - "ru.lproj/Localizable.strings"
    dependencies:
      - package: Argon2
        product: CArgon2
    settings:
      base:
        INFOPLIST_FILE: VaultGuard/AutoFillProvider/Info.plist
        CODE_SIGN_ENTITLEMENTS: VaultGuard/AutoFillProvider/AutoFill.entitlements
        PRODUCT_NAME: VaultGuardAutoFill
        PRODUCT_BUNDLE_IDENTIFIER: com.kruatech.vaultguard.autofill
    entitlements:
      path: VaultGuard/AutoFillProvider/AutoFill.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.developer.authentication-services.autofill-credential-provider: true
        com.apple.security.application-groups:
          - group.com.kruatech.vaultguard
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.kruatech.vaultguard

  VaultGuardTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: VaultGuardTests
      - path: VaultGuard/Services/KeePass/KeePassStreamCiphers.swift
      - path: VaultGuard/Services/KeePass/KeePassKDF.swift
      - path: VaultGuard/Services/Argon2KDF.swift
      - path: VaultGuard/Services/KeePass/KDBXReader.swift
      - path: VaultGuard/Services/KeePass/KDBXVaultMapper.swift
      - path: VaultGuard/Services/KeePass/KDBXWriter.swift
      - path: VaultGuard/Services/VaultDecryptor.swift
      - path: VaultGuard/Services/VaultBackend.swift
      - path: VaultGuard/Services/VaultMigrator.swift
      - path: VaultGuard/Services/Fido2.swift
      - path: VaultGuard/Services/CryptoService.swift
      - path: VaultGuard/Services/SecureData.swift
      - path: VaultGuard/Services/TOTPService.swift
      - path: VaultGuard/Services/Logger.swift
      - path: VaultGuard/Services/LocalizationManager.swift
      - path: VaultGuard/Services/SearchTranslit.swift
      - path: VaultGuard/Services/BitwardenEndpoints.swift
      - path: VaultGuard/Services/PasswordAudit.swift
      - path: VaultGuard/Services/RecentCiphersStore.swift
      - path: VaultGuard/Services/KeePassBackupPolicy.swift
      - path: VaultGuard/Services/VaultListPipeline.swift
      - path: VaultGuard/Services/ZipListing.swift
      - path: VaultGuard/Services/ZipArchive.swift
      - path: VaultGuard/Services/OnePasswordImporter.swift
      - path: VaultGuard/Services/TextScaleManager.swift
      - path: VaultGuard/Design/VGDesign.swift
      - path: VaultGuard/Shared/SharedConfig.swift
      - path: VaultGuard/Shared/AutoFillHostMatcher.swift
      - path: VaultGuard/Models/Models.swift
      - path: VaultGuard/ViewModels/Account.swift
    dependencies:
      - package: Argon2
        product: CArgon2
    settings:
      base:
        PRODUCT_NAME: VaultGuardTests
        PRODUCT_MODULE_NAME: VaultGuardTests
        PRODUCT_BUNDLE_IDENTIFIER: com.kruatech.vaultguard.tests
        GENERATE_INFOPLIST_FILE: YES
        # The global settings.base hands every target the app's entitlements, which include
        # the AutoFill credential-provider capability. A unit-test bundle neither needs it nor
        # has a provisioning profile granting it, so signing failed before a single test ran.
        # Cleared here only; the app and the extension keep theirs.
        CODE_SIGN_ENTITLEMENTS: ""
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
