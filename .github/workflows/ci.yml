name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

# Least privilege: CI only reads the repo. (release.yml declares its own.)
permissions:
  contents: read

# Cancel superseded runs of the same branch/PR to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build & test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Build without code signing so CI needs no certificates/provisioning.
      - name: Build
        run: >
          xcodebuild build
          -scheme VaultGuard
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=
          -quiet

      - name: Test
        run: >
          xcodebuild test
          -scheme VaultGuard
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=
          -quiet

  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: No committed user/signing state
        run: |
          if git ls-files | grep -E 'Signing\.local|xcuserdata|xcuserstate'; then
            echo "::error::Committed signing/user-state files found"; exit 1
          fi

      - name: No force-unwrapped URL(string:)
        run: |
          if grep -rnE 'URL\(string: [^)]*\)!' VaultGuard --include='*.swift'; then
            echo "::error::force-unwrapped URL(string:) found — use guard + APIError.invalidURL"; exit 1
          fi

      - name: No reintroduced legacy keychain/cache API
        run: |
          if grep -rnE '\.clearAll\(\)|VaultCache\.shared|hasLegacyAccount|migrateLegacy' VaultGuard --include='*.swift'; then
            echo "::error::legacy keychain/cache symbols reintroduced"; exit 1
          fi

      - name: No misleading master-password persistence copy
        run: |
          if grep -rnEi 'master password saved|password will be stored|save master password' VaultGuard --include='*.swift' --include='*.strings'; then
            echo "::error::Misleading master-password persistence copy found"; exit 1
          fi

      - name: Localizations have matching keys
        run: |
          python3 - <<'EOF'
          import re
          from pathlib import Path
          en = set(re.findall(r'^"([^"]+)"\s*=', Path('VaultGuard/Resources/en.lproj/Localizable.strings').read_text(), re.M))
          ru = set(re.findall(r'^"([^"]+)"\s*=', Path('VaultGuard/Resources/ru.lproj/Localizable.strings').read_text(), re.M))
          missing_ru = sorted(en - ru)
          missing_en = sorted(ru - en)
          if missing_ru or missing_en:
              print('Missing in ru:', missing_ru)
              print('Missing in en:', missing_en)
              raise SystemExit(1)
          print(f'ok: {len(en)} localization keys in parity')
          EOF

      # The Argon2 implementation that derives every vault key is vendored in Packages/Argon2
      # at a pinned upstream commit. It replaced the Argon2Swift package, which pulled the same
      # library in on a floating branch and as a git submodule that broke fresh clones. Any
      # change to these files must be a reviewed update recorded in PROVENANCE.md — never
      # something that arrives with an unrelated change.
      - name: Vendored Argon2 matches SHA256SUMS
        working-directory: Packages/Argon2/Sources/CArgon2
        run: sha256sum --check --strict ../../SHA256SUMS

      # SHA256SUMS lists what should be there; a file added beside them would pass the check
      # above unnoticed.
      - name: No unlisted files in vendored Argon2
        working-directory: Packages/Argon2/Sources/CArgon2
        run: |
          listed=$(awk '{print $2}' ../../SHA256SUMS | LC_ALL=C sort)
          present=$(find . -type f \( -name '*.c' -o -name '*.h' \) | LC_ALL=C sort)
          if [ "$listed" != "$present" ]; then
            echo "::error::Vendored Argon2 source files differ from SHA256SUMS"
            diff <(echo "$listed") <(echo "$present") || true
            exit 1
          fi

      # The strongest form of the old "no branch-based pins" check: no remote Swift packages
      # at all. Anything the build compiles is in this repository. Adding a remote dependency
      # is possible, but it should be a decision someone makes on purpose, which starts by
      # changing this check.
      - name: No remote Swift package dependencies
        run: |
          python3 - <<'EOF'
          import re, sys, json
          from pathlib import Path
          # Standard library only, like the other checks here: the runner is not guaranteed
          # to have PyYAML. The packages block is every indented line under `packages:`.
          block = re.search(r'^packages:\n((?:[ \t]+.*\n|[ \t]*\n)*)', Path('project.yml').read_text(), re.M)
          body = block.group(1) if block else ''
          packages = re.findall(r'^  (\w[\w-]*):\s*$', body, re.M)
          remote = re.findall(r'^\s+url:\s*(\S+)', body, re.M)
          if remote:
              for url in remote:
                  print(f'::error::remote Swift package in project.yml: {url}')
              sys.exit(1)
          resolved = Path('VaultGuard.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved')
          if resolved.exists():
              pins = json.loads(resolved.read_text()).get('pins') or []
              if pins:
                  print('::error::Package.resolved pins remote packages:', [p.get('identity') for p in pins])
                  sys.exit(1)
          print(f'ok: {len(packages)} package(s), all local')
          EOF

      # A literal key (`"misc.yes".localized`) is invisible to the compiler: a typo shows the raw
      # key to the user instead of failing the build. Keys go through L10n constants.
      - name: No literal localization keys
        run: |
          if grep -rnE '"[a-zA-Z0-9_]+\.[a-zA-Z0-9_.]+"\.localized' VaultGuard --include='*.swift' \
               | grep -v 'Services/LocalizationManager.swift'; then
            echo "::error::literal localization key — add a constant to L10n instead"; exit 1
          fi

      - name: No committed .DS_Store
        run: |
          if git ls-files | grep -E '(^|/)\.DS_Store$'; then
            echo "::error::.DS_Store committed"; exit 1
          fi

      - name: No review/demo placeholders or obvious secrets
        run: |
          # Scope: whole repo except this workflow (which names the tokens) and LICENSE.
          if git grep -nE 'REPLACE_BEFORE_SUBMISSION|DEMO_SERVER|DEMO_EMAIL|DEMO_PASSWORD|BEGIN (RSA |OPENSSH )?PRIVATE KEY' \
               -- ':!.github/workflows/*' ':!LICENSE'; then
            echo "::error::Review placeholder or private-key material found"; exit 1
          fi

      - name: No stale positioning regressions (canonical public docs)
        run: |
          # These exact phrasings were removed during the multi-vault repositioning;
          # they must not return to the public-facing docs.
          if grep -rniE 'unofficial[, ]+third-party native macOS client|unofficial Bitwarden client|unofficial, third-party client' \
               README.md CONTRIBUTING.md PRIVACY.md SECURITY.md TRADEMARKS.md NOTICE docs/security-model.md docs/app-store-listing.md docs/app-store-review-notes.md 2>/dev/null; then
            echo "::error::Stale 'unofficial client' positioning found in a public doc"; exit 1
          fi

      - name: No developer-hosted-service claims (review notes)
        run: |
          # The developer runs no server; review notes must not promise a demo/hosted server.
          if grep -rniE 'use this demo server|developer-provided server|we (host|operate|provide) (a|the|our) server' \
               docs/app-store-review-notes.md 2>/dev/null; then
            echo "::error::Hosted/demo-server claim in review notes"; exit 1
          fi

      - name: No forbidden debug strings / TODO markers in source
        run: |
          # Logger (Log.app/Log.fault/Log.crypto) is the sanctioned logging path.
          if grep -rnE '\bNSLog\(|\bdebugPrint\(|//[[:space:]]*(TODO|FIXME)\b' VaultGuard --include='*.swift'; then
            echo "::error::Debug call or TODO/FIXME marker found in source"; exit 1
          fi

  release-readiness:
    name: Release readiness
    # Only on a version tag or manual run — not on every PR, so pending owner assets
    # (screenshots/GIF) do not block routine CI.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: README asset links resolve
        run: |
          python3 - <<'EOF'
          import re, pathlib, sys
          readme = pathlib.Path('README.md').read_text()
          refs = re.findall(r'(?:src="|\]\()(docs/assets/[^")\s]+)', readme)
          missing = [r for r in dict.fromkeys(refs) if not pathlib.Path(r).exists()]
          if missing:
              for m in missing: print(f'::error::README references missing asset: {m}')
              sys.exit(1)
          print(f'ok: {len(set(refs))} README asset link(s) resolve')
          EOF

      - name: Version is consistent (project.yml / changelog / README)
        run: |
          python3 - <<'EOF'
          import re, pathlib, sys
          pj = pathlib.Path('project.yml').read_text()
          mv = re.search(r'MARKETING_VERSION:\s*"?([0-9]+\.[0-9]+\.[0-9]+)"?', pj)
          if not mv:
              print('::error::MARKETING_VERSION not found in project.yml'); sys.exit(1)
          version = mv.group(1)
          ch = pathlib.Path('CHANGELOG.md').read_text()
          if f'[{version}]' not in ch:
              print(f'::error::CHANGELOG.md has no section for {version}'); sys.exit(1)
          print(f'ok: version {version} present in project.yml and CHANGELOG.md')
          EOF

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Unsigned archive smoke: catches archive-time breakage without certificates.
      # Signed validation / notarization / upload is a credentialed step done with
      # repository secrets or manually (see docs/release-smoke-checklist.md).
      - name: Unsigned archive builds
        run: >
          xcodebuild archive
          -scheme VaultGuard
          -destination 'generic/platform=macOS'
          -archivePath build/VaultGuard.xcarchive
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=
          -quiet

      - name: Archive contains the app and the AutoFill extension
        run: |
          app="build/VaultGuard.xcarchive/Products/Applications/VaultGuard.app"
          test -d "$app" || { echo "::error::archived app missing"; exit 1; }
          ls "$app/Contents/PlugIns/"*.appex >/dev/null 2>&1 \
            || { echo "::error::AutoFill .appex missing from archive"; exit 1; }
          echo "ok: archive contains app + AutoFill extension"
